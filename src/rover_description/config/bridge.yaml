# config/bridge.yaml
# Parameter bridge configuration between Ignition Gazebo and ROS 2

# ============================================================
# CLOCK (Gazebo -> ROS)
# ============================================================
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "ignition.msgs.Clock"
  direction: GZ_TO_ROS

# ============================================================
# LIDAR SCAN (Gazebo -> ROS)
# ============================================================
- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "ignition.msgs.LaserScan"
  direction: GZ_TO_ROS

# ============================================================
# IMU (Gazebo -> ROS)
# ============================================================
- ros_topic_name: "/imu/data"
  gz_topic_name: "/imu/data"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "ignition.msgs.IMU"
  direction: GZ_TO_ROS


# ============================================================
# Note on other topics:
# - /joint_states is published directly by ros2_control's
#   joint_state_broadcaster (bridging it from Gazebo creates
#   duplicate publishers with conflicting QoS).
# - /tf is published directly by robot_state_publisher.
# - Wheel velocity commands are sent via ROS 2 control on
#   /rover_base_controller/commands.
# ============================================================
